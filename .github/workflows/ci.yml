name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --locked
      - run: uv run ruff check .
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: 2a8d2174173ab8d05d0b48a44580a8c0b2c8c19b
          path: .hermes-source
      - run: uv pip install -e .hermes-source
      - run: uv run pytest
        env:
          HERMES_SOURCE_PATH: ${{ github.workspace }}/.hermes-source

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
